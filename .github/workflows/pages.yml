name: Deploy website to GitHub Pages

# Rebuilds the site from source (website/build_site.py -> docs/) and deploys it
# automatically on every push to main that touches the manuscript, figures, or
# site code. Replaces the flaky "deploy from branch" (legacy) mode, which kept
# reverting build_type and blocking deploys.
on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "website/**"
      - "docs/**"
      - "results/ml/**"
      - "results/tables/**"
      - "analysis/ml/README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}          # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install --quiet "markdown>=3.5"
      - name: Build the static site (regenerates docs/ from manuscript sources)
        run: python website/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
